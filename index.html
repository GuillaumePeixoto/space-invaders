<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <title>Space Invaders</title>
</head>
<body>
    <main>
        <div id="main-menu">
            <h2>Space Invaders</h2>
            <div>
                <button id="play-button">
                    <img class="img-button" src="images/Spaceship.png" alt="Spaceship">
                    Play
                </button>
                <!-- <button>Custom game</button> -->
                 <button class="score-button">Score</button>
            </div>
        </div>
        <div id="game-view">
            <div id="game-infos">
                <h2>Space invaders</h2>
                <p>Score : <span id="score-count">0</span></p>
            </div>
            <div id="game-screen">
                <div id="invasion-zone">
                    <div id="enemy-zone">

                    </div>
                </div>
                <div id="level-transition"></div>
                <div id="lazer-item">
                    <p id="lazer-count">0</p>
                    <img src="images/lazer-canon-icon.png" alt="Laser">
                </div>
            </div>
        </div>
        <div id="end-screen">
            <h2>Game Over</h2>
            <p>Your score : <span id="final-score">0</span></p>
            <p>Level : <span id="final-level">0</span></p>
            <div>
                <button id="restart-button">Restart</button>
                <!-- <button>Custom game</button> -->
                 <button class="score-button">Score</button>
            </div>
        </div>
        <div id="score">
            <h2>Highest Scores</h2>
            <table>
                <thead>
                    <tr>
                        <th>Level</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="score-table-body">
                </tbody>
            </table>
            <button id="back-button">Back</button>
        </div>
    </main>
    <script src="script/main.js"></script>
    <script src="script/player.js"></script>
    <script src="script/enemy.js"></script>
    <script src="script/level.js"></script>
    <script src="script/game.js"></script>
    <script src="script/enemy-formation.js"></script>
    <script src="script/bullet.js"></script>
    <script src="script/score.js"></script>
    <script src="script/lazer.js"></script>
</body>
</html>
